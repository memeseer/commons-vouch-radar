name: Update vouch snapshot

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vouch-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build top-20k snapshot
        run: node scripts/build-snapshot.mjs
      - name: Commit updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/vouch-snapshot.json
          if git diff --cached --quiet; then
            echo "Snapshot unchanged"
          else
            git commit -m "data: update hourly vouch snapshot"
            git push
          fi
